<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
        <!-- Основная информация -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flooring Installation Services in Toronto{% endblock %}</title>
    {% block seo %}{% endblock %}
    <!-- Google search -->
    <meta name="google-site-verification" content="dW1EV64CPAGgzRUxnXTXayAVEYw4zxErgJUnLTJZrQs" />
    <!-- Google search -->
    <meta name="description" content="Professional flooring installation services in Toronto, offering vinyl, laminate, linoleum, and hardwood flooring for homes and businesses.">
    <meta name="keywords" content="flooring installation Toronto, vinyl flooring, laminate flooring, linoleum, hardwood flooring, commercial and residential flooring services">
    <meta name="author" content="Jenya Tarasenko - https://www.web-mars.com/">
    
        <!-- Open Graph (для соцсетей) -->
    <meta property="og:title" content="Flooring Installation Services in Toronto">
    <meta property="og:description" content="Expert flooring installation in Toronto. Offering vinyl, laminate, linoleum, and hardwood floors for all spaces, with fast, reliable service.">
    <meta property="og:image" content="https://www.pro-floor-installers.com/static/image/logo-black.png">

    <meta property="og:url" content="https://www.pro-floor-installers.com/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_CA">
    <meta property="og:site_name" content="Flooring Installation Services">
    
        <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Flooring Installation Services in Toronto">
    <meta name="twitter:description" content="High-quality flooring services in Toronto, including vinyl, laminate, linoleum, and hardwood installation for homes and businesses.">
    <meta name="twitter:image" content="https://www.pro-floor-installers.com/static/image/logo-black.png">

        <!-- Favicon -->

    <!-- Apple иконка -->
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'image/favicon/favicon180.png' %}">
        <!-- Android иконка -->
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'image/favicon/favicon32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'image/favicon/favicon16.png' %}">
        <!-- Canonical URL -->
    <link rel="canonical" href="https://www.pro-floor-installers.com/">
    
        <!-- Robots -->
    <meta name="robots" content="index, follow">
    <!-- Указываем, что это страница на английском языке -->
    <link rel="alternate" hreflang="en" href="https://www.pro-floor-installers.com/">
    <link rel="alternate" hreflang="x-default" href="https://www.pro-floor-installers.com/">
 
    
        <!-- верификация в гугл search console -->

    
        <!-- Безопасность -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="referrer" content="no-referrer-when-downgrade">
    
        <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
        {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Flooring Installation Services in Toronto",
        "url": "https://www.pro-floor-installers.com/",
        "description": "Professional flooring installation services in Toronto, offering vinyl, laminate, linoleum, and hardwood flooring for homes and businesses.",
        "potentialAction": {
            "@type": "SearchAction",
            "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://www.pro-floor-installers.com/search?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
        }
        }
    </script>
         <!-- Alpine.jsAlpine.js — “легкий Vue для маленьких интерактивных частей сайта” меню выпадающие списки -->
    <script src="https://cdn.jsdelivr.net/npm/@alpinejs/intersect@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
      <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        montserrat: ['Montserrat', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
            <!-- Стили -->
